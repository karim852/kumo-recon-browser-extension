<!doctype html>
<html lang="en" data-v="void">
<head>
<meta charset="utf-8">
<title>Kumo</title>
<link rel="stylesheet" href="src/theme.css">
<link rel="stylesheet" href="src/popup.css">
</head>
<body>

<!-- ── HEADER ────────────────────────────────────────────── -->
<header class="hdr">
  <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
    <g fill="none" stroke="currentColor" stroke-linecap="round">
      <g opacity=".45" stroke-width="1.1">
        <path d="M24 24 24 5M24 24 37.4 10.6M24 24 43 24M24 24 37.4 37.4M24 24 24 43M24 24 10.6 37.4M24 24 5 24M24 24 10.6 10.6"/>
      </g>
      <g opacity=".55" stroke-width="1.2">
        <path d="M24 9.3Q28.6 12.1 30.6 17.4Q36 19.4 38.7 24Q36 28.6 30.6 30.6Q28.6 36 24 38.7Q19.4 36 17.4 30.6Q12 28.6 9.3 24Q12 19.4 17.4 17.4Q19.4 12.1 24 9.3Z"/>
      </g>
      <g stroke-width="1.5">
        <path d="M24 14.6Q27.2 16.5 28.6 19.4Q31.5 20.8 33.4 24Q31.5 27.2 28.6 28.6Q27.2 31.5 24 33.4Q20.8 31.5 19.4 28.6Q16.5 27.2 14.6 24Q16.5 20.8 19.4 19.4Q20.8 16.5 24 14.6Z"/>
      </g>
    </g>
    <circle cx="24" cy="24" r="2.4" fill="var(--text)"/>
  </svg>
  <div class="hdr-id">
    <div class="wordmark">KUM<em>O</em></div>
    <div class="tagline">蜘蛛 · recon · osint · breach intel</div>
  </div>
  <div class="hdr-sp"></div>
  <div class="theme-pick" role="group" aria-label="Theme">
    <button class="theme-dot td-void"   data-theme="void"   title="Void"       aria-pressed="true"></button>
    <button class="theme-dot td-glass"  data-theme="glass"  title="Void Glass" aria-pressed="false"></button>
    <button class="theme-dot td-web"    data-theme="web"    title="Web 蜘蛛"    aria-pressed="false"></button>
    <button class="theme-dot td-carbon" data-theme="carbon" title="Carbon"     aria-pressed="false"></button>
  </div>
  <button class="lamp probing" id="lamp" title="Kumo server status — click to re-check">
    <i></i><span id="lampTxt">…</span>
  </button>
</header>

<!-- ── TARGET ────────────────────────────────────────────── -->
<div class="target">
  <span class="prompt">❯</span>
  <div class="inp-wrap">
    <input id="dom" type="text" placeholder="domain to scan" autocomplete="off" spellcheck="false">
    <button class="inp-tab" id="useTab" title="Use the domain of the active tab">TAB</button>
  </div>
  <button class="btn btn-scan" id="scanBtn">SCAN</button>
  <button class="btn btn-fast" id="fastBtn" title="Skip the slow modules">⚡</button>
  <button class="btn btn-stop hide" id="stopBtn">STOP</button>
</div>

<!-- ── CONTROL STRIP ─────────────────────────────────────── -->
<div class="strip">
  <button class="chip-btn" id="togglePicker">modules</button>
  <span><b id="selCount">0</b>/<span id="totCount">25</span></span>
  <button class="chip-btn" id="presetQuick" title="A handful of fast modules">quick</button>
  <button class="chip-btn" id="presetAll">all</button>
  <button class="chip-btn" id="presetNone">none</button>
  <span class="hdr-sp"></span>
  <span class="timer" id="timer"></span>
</div>

<!-- ── MODULE PICKER ─────────────────────────────────────── -->
<div class="picker" id="picker"></div>

<!-- ── SUMMARY ───────────────────────────────────────────── -->
<div class="summary" id="summary"></div>
<div class="prog" id="prog"><i id="progBar"></i></div>

<!-- ── STREAM ────────────────────────────────────────────── -->
<main class="stream" id="stream">
  <section class="welcome" id="welcome">
    <div class="big">🕸</div>
    <h2>KUMO 蜘蛛</h2>
    <p>Open a site, hit <strong>SCAN</strong>, and 27 modules map everything
       reachable about the domain — straight into this panel.</p>
    <p class="hintline" id="welcomeHint">Needs the local engine: <code>python3 kumo.py --web</code></p>
  </section>
</main>

<!-- ── FOOTER ────────────────────────────────────────────── -->
<footer class="ftr">
  <button id="exportBtn" title="Download the raw scan JSON">⭳ json</button>
  <button id="copyBtn" title="Copy a findings summary to the clipboard">⧉ copy</button>
  <button id="clearBtn">⨯ clear</button>
  <span class="sp"></span>
  <button id="openDash" title="Open the full Kumo dashboard">dashboard ↗</button>
  <button id="openOpts" title="Settings">⚙</button>
</footer>

<div class="toasts" id="toasts"></div>

<script type="module" src="src/popup.js"></script>
</body>
</html>
